<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details - OmniStore</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-slate-800 font-sans min-h-screen flex flex-col">

  <!-- Header & Navigation -->
  <header class="bg-white border-b sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <a href="index.html" class="text-slate-600 hover:text-blue-600">
          <i class="fa-solid fa-arrow-left text-lg"></i>
        </a>
        <a href="index.html" class="text-xl font-bold tracking-tight text-slate-900">
          Omni<span class="text-blue-600">Store</span>
        </a>
      </div>
      <a href="checkout.html" class="relative p-2 text-slate-700 hover:text-blue-600">
        <i class="fa-solid fa-cart-shopping text-xl"></i>
        <span id="cartCount" class="absolute -top-1 -right-1 bg-blue-600 text-white text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center">0</span>
      </a>
    </div>
  </header>

  <!-- Main Product Detail Section -->
  <main class="max-w-4xl mx-auto px-4 py-6 flex-grow w-full">
    <div id="productContainer" class="bg-white rounded-xl border border-gray-100 shadow-sm p-4 md:p-6">
      <!-- Loading State -->
      <div class="text-center py-12 text-gray-400">
        <i class="fa-solid fa-spinner fa-spin text-3xl mb-3 text-blue-600"></i>
        <p class="text-xs">Loading product details...</p>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-white border-t py-6 text-center text-xs text-gray-500 mt-auto">
    <p>&copy; 2026 OmniStore. All rights reserved.</p>
  </footer>

  <!-- Page Logic Script -->
  <script>
    // Mobile-compatible Google Sheet Endpoint
    const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/1P15PxqkSylm1obTA0w_GgLWlFQtuFvEa2y9Hl2_m100/gviz/tq?tqx=out:csv';
    let currentProduct = null;
    let selectedImage = '';

    // Load Product from URL ID
    async function loadProductDetails() {
      const container = document.getElementById('productContainer');
      const urlParams = new URLSearchParams(window.location.search);
      const productId = parseInt(urlParams.get('id'));

      if (!productId) {
        showError('Invalid Product ID');
        return;
      }

      try {
        const response = await fetch(SHEET_CSV_URL);
        if (!response.ok) throw new Error('Sheet not accessible');
        
        const csvText = await response.text();
        const products = parseCSV(csvText);

        currentProduct = products.find(p => p.id === productId);

        if (!currentProduct) {
          showError('Product not found.');
          return;
        }

        selectedImage = currentProduct.mainImage;
        renderProductView();
      } catch (error) {
        console.error(error);
        showError('Unable to load product information.');
      }
    }

    // CSV Parser
    function parseCSV(csv) {
      const lines = csv.trim().split('\n');
      const products = [];

      for (let i = 1; i < lines.length; i++) {
        const line = lines[i];
        if (!line.trim()) continue;

        let insideQuote = false;
        let entry = '';
        const row = [];

        for (let char of line) {
          if (char === '"') {
            insideQuote = !insideQuote;
          } else if (char === ',' && !insideQuote) {
            row.push(entry.trim().replace(/^"|"$/g, ''));
            entry = '';
          } else {
            entry += char;
          }
        }
        row.push(entry.trim().replace(/^"|"$/g, ''));

        if (row.length >= 4) {
          const rawImages = row[3] ? row[3].split(',').map(url => url.trim()) : [];
          
          products.push({
            id: i,
            title: row[0] || 'Untitled Product',
            price: parseFloat(row[1]) || 0,
            stock: parseInt(row[2]) || 0,
            mainImage: rawImages[0] || 'https://via.placeholder.com/300?text=No+Image',
            allImages: rawImages,
            category: row[4] || 'General'
          });
        }
      }
      return products;
    }

    // Render Product Details & Gallery
    function renderProductView() {
      const container = document.getElementById('productContainer');
      const isOutOfStock = currentProduct.stock <= 0;

      // Generate Gallery Thumbnails HTML
      const thumbnailsHTML = currentProduct.allImages.length > 1 ? `
        <div class="flex gap-2 mt-3 overflow-x-auto pb-2">
          ${currentProduct.allImages.map((img, idx) => `
            <button 
              onclick="switchMainImage('${img}')" 
              class="w-16 h-16 rounded-lg border-2 overflow-hidden flex-shrink-0 focus:outline-none transition ${img === selectedImage ? 'border-blue-600 scale-95' : 'border-gray-200 opacity-70'}">
              <img src="${img}" alt="Thumbnail ${idx + 1}" class="w-full h-full object-cover">
            </button>
          `).join('')}
        </div>
      ` : '';

      container.innerHTML = `
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-start">
          
          <!-- Image Gallery Section -->
          <div>
            <div class="h-72 md:h-96 bg-gray-50 rounded-lg overflow-hidden flex items-center justify-center relative border border-gray-100">
              ${isOutOfStock ? '<span class="absolute top-3 right-3 bg-red-500 text-white text-xs font-bold px-2.5 py-1 rounded z-10">Out of Stock</span>' : ''}
              <img 
                id="mainImageDisplay"
                src="${selectedImage}" 
                alt="${currentProduct.title}" 
                class="w-full h-full object-cover transition duration-300"
                onerror="this.src='https://via.placeholder.com/300?text=Image+Error'"
              >
            </div>
            ${thumbnailsHTML}
          </div>

          <!-- Info & Purchase Section -->
          <div class="flex flex-col justify-between h-full">
            <div>
              <span class="text-[11px] font-bold uppercase tracking-wider text-blue-600 bg-blue-50 px-2.5 py-1 rounded-full">${currentProduct.category}</span>
              <h1 class="text-xl md:text-2xl font-bold text-slate-900 mt-3">${currentProduct.title}</h1>
              <p class="text-2xl font-extrabold text-slate-900 mt-2">₦${currentProduct.price.toLocaleString()}</p>
              
              <div class="mt-4 pt-4 border-t border-gray-100 text-xs text-gray-500 space-y-1">
                <p><span class="font-medium text-slate-700">Availability:</span> ${isOutOfStock ? '<span class="text-red-500 font-bold">Out of Stock</span>' : `<span class="text-green-600 font-bold">${currentProduct.stock} items left</span>`}</p>
                <p><span class="font-medium text-slate-700">Shipping:</span> Standard Delivery Available</p>
              </div>
            </div>

            <div class="mt-6 pt-4 border-t border-gray-100">
              <button 
                onclick="addToCart()"
                ${isOutOfStock ? 'disabled' : ''}
                class="w-full text-sm py-3 rounded-lg font-bold transition flex items-center justify-center gap-2 ${
                  isOutOfStock 
                    ? 'bg-gray-200 text-gray-400 cursor-not-allowed' 
                    : 'bg-blue-600 text-white hover:bg-blue-700 active:scale-95 shadow-md shadow-blue-200'
                }">
                <i class="fa-solid fa-cart-plus"></i>
                ${isOutOfStock ? 'Item Out of Stock' : 'Add to Cart'}
              </button>
            </div>

          </div>
        </div>
      `;
    }

    // Switch Main Image Preview
    function switchMainImage(imgUrl) {
      selectedImage = imgUrl;
      renderProductView();
    }

    // Add Item to LocalStorage Cart
    function addToCart() {
      if (!currentProduct || currentProduct.stock <= 0) return;

      const cart = JSON.parse(localStorage.getItem('omniCart')) || [];
      const existingItem = cart.find(item => item.title === currentProduct.title);

      if (existingItem) {
        existingItem.quantity += 1;
      } else {
        cart.push({
          title: currentProduct.title,
          price: currentProduct.price,
          image: currentProduct.mainImage,
          quantity: 1
        });
      }

      localStorage.setItem('omniCart', JSON.stringify(cart));
      updateCartBadge();
      alert(`Added "${currentProduct.title}" to your cart!`);
    }

    function updateCartBadge() {
      const cart = JSON.parse(localStorage.getItem('omniCart')) || [];
      const totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
      document.getElementById('cartCount').textContent = totalCount;
    }

    function showError(msg) {
      document.getElementById('productContainer').innerHTML = `
        <div class="text-center py-10 text-red-500">
          <i class="fa-solid fa-circle-exclamation text-3xl mb-2"></i>
          <p class="text-sm font-semibold">${msg}</p>
          <a href="index.html" class="inline-block mt-4 text-xs bg-slate-900 text-white px-4 py-2 rounded-lg">Return to Store</a>
        </div>
      `;
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadProductDetails();
      updateCartBadge();
    });
  </script>
</body>
</html>
