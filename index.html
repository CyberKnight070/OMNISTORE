<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to OmniStore</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-white font-sans min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-slate-800 border border-slate-700/80 rounded-3xl p-8 text-center space-y-6 shadow-2xl">
    
    <!-- Store Badge Icon -->
    <div class="w-20 h-20 bg-blue-600 rounded-2xl flex items-center justify-center mx-auto shadow-lg shadow-blue-500/30">
      <i class="fa-solid fa-bag-shopping text-3xl text-white"></i>
    </div>

    <!-- Greeting Text -->
    <div class="space-y-2">
      <h1 class="text-3xl font-black tracking-tight text-white">Welcome to OmniStore</h1>
      <p class="text-slate-400 text-xs leading-relaxed px-4">
        Explore our curated collection of quality products. Fast delivery and secure payments guaranteed.
      </p>
    </div>

    <!-- CTA Welcome Button -->
    <a href="shop.html" class="inline-flex items-center justify-center w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3.5 rounded-xl shadow-md transition active:scale-95 gap-2 text-xs">
      <span>Welcome & Start Shopping</span>
      <i class="fa-solid fa-arrow-right text-xs"></i>
    </a>

  </div>

</body>
</html>
